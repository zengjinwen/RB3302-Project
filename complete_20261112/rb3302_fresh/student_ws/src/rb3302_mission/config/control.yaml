rb3302_mission:
  ros__parameters:
    drive_speed: 0.24          # 普通路段匀速 m/s
    slowdown_distance: 0.15  # 沿路线到停车目标剩余15cm开始减速
    approach_speed: 0.07     # 临近目标前进速度 m/s；到点仍发零
    turn_speed: 1.80           # 原地转弯最大 rad/s
    turn_early_stop_degrees: 15.0   # 提前15度发停车
    turn_min_speed: 0.0       # 最低转速限制已取消；保留给旧arc版本兼容
    heading_kp: 1.5          # 保留原朝向比例强度
    heading_ki: 0.03         # 小幅积分；贡献限制在±0.05rad/s
    heading_kd: 0.08         # 对AMCL转速做阻尼
    heading_d_filter_time: 0.20 # 微分项滤波时间，s
    stanley_angular_gain: 1.5 # 保留原Stanley横向项强度
    stanley_cross_gain: 0.4   # 横向偏差增益，1/s
    stanley_front_offset: 0.10 # 车体前方参考点，m；提前回正
    stanley_soft_speed: 0.10  # 低速软化项，m/s
    drive_turn_limit: 0.50
    stop_distance: 0.22        # 静态地图中心线与墙的规划间距 m
    arc_radius: 0.18        # 90-degree tangent corner radius, m
    arc_speed: 0.06         # Rolling corner forward speed, m/s
    arc_cross_gain: 2.0     # Radial-error correction, rad/(m*s)
    arc_heading_gain: 3.0   # Stronger arc heading correction; straight PID unchanged
    arc_turn_limit: 2.0     # Match base-driver command cap; not measured turning rate
    arc_exit_heading_degrees: 5.0 # Complete heading before handing off to next line
    obstacle_confirm_time: 0.3 # Same cell across >=3 fresh scans
    obstacle_min_width: 0.20   # Broad observed face across grid centre, m
    obstacle_boundary_tolerance: 0.20 # Only within 20cm of adjacent cell near boundary
