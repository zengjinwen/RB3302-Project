ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/raw
    # 用底盘实测前进速度；不把指令角速度当成实测转速。
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    imu0: /imu_data_ros
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_relative: true
    imu0_queue_size: 50

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.6
    alpha4: 0.3
    alpha5: 0.2
    laser_model_type: likelihood_field
    sigma_hit: 0.08
    z_hit: 0.9
    z_rand: 0.1
    max_beams: 120
    min_particles: 1500
    max_particles: 2500
    update_min_d: 0.05
    update_min_a: 0.1
