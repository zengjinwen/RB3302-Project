ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/raw
    # 用底盘实测前进速度；不把指令角速度当成实测转速。
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    imu0: /imu_data_ros
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_relative: true
    imu0_queue_size: 50

amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::RB3302DifferentialMotionModel
    # 比原来的 0.8 更信任里程计，激光仍修正长期漂移。
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # 运动时每帧有效激光都可更新，不再等累计走够2cm。
    update_min_d: 0.0
    update_min_a: 0.0
    # Trial density increase; verify scan processing latency on the robot.
    min_particles: 1000
    max_particles: 3000
    max_beams: 120
    resample_interval: 1
    transform_tolerance: 1.0
