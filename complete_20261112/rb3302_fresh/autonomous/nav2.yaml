amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 800
    max_particles: 2500
    max_beams: 90
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 1.0
    laser_max_range: 8.0
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    update_min_d: 0.01
    update_min_a: 0.02
    resample_interval: 1
    transform_tolerance: 0.3
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/raw
    odom0_config:
    - false
    - false
    - false
    - false
    - false
    - false
    - true
    - true
    - false
    - false
    - false
    - false
    - false
    - false
    - false
    odom0_queue_size: 10
    imu0: /imu_data_ros
    imu0_config:
    - false
    - false
    - false
    - false
    - false
    - true
    - false
    - false
    - false
    - false
    - false
    - true
    - false
    - false
    - false
    imu0_relative: true
    imu0_queue_size: 30
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.03
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: true
controller_server:
  ros__parameters:
    controller_frequency: 30.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins:
    - progress
    goal_checker_plugins:
    - goal
    controller_plugins:
    - FollowPath
    progress:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.15
      movement_time_allowance: 10.0
    goal:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.025
      stateful: false
      yaw_goal_tolerance: 3.141592653589793
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      lookahead_dist: 0.16
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.22
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.7
      allow_reversing: false
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      resolution: 0.025
      rolling_window: false
      track_unknown_space: true
      robot_radius: 0.15
      always_send_full_costmap: true
      plugins:
      - static
      - obstacles
      - inflation
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: clear mark
        clear:
          topic: /scan
          data_type: LaserScan
          marking: false
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 0.5
          observation_persistence: 0.0
        mark:
          topic: /obstacle_scan
          data_type: LaserScan
          marking: true
          clearing: false
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 0.5
          observation_persistence: 0.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      footprint_padding: 0.01
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      resolution: 0.025
      rolling_window: true
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static
      - obstacles
      - inflation
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: clear mark
        clear:
          topic: /scan
          data_type: LaserScan
          marking: false
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 0.5
          observation_persistence: 0.0
        mark:
          topic: /obstacle_scan
          data_type: LaserScan
          marking: true
          clearing: false
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 0.5
          observation_persistence: 0.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      width: 3
      height: 3
      footprint: '[[-0.10, -0.10], [-0.10, 0.10], [0.10, 0.10], [0.10, -0.10]]'
      footprint_padding: 0.01
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 1000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity:
    - 0.2
    - 0.0
    - 0.6
    min_velocity:
    - -0.1
    - 0.0
    - -0.6
    max_accel:
    - 0.3
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.5
    velocity_timeout: 0.3
    odom_topic: /odom
